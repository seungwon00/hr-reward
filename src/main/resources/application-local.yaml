spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:hr_reward}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:hr_reward}
    password: ${DB_PASSWORD:hr_reward}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
